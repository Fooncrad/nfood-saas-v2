<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4b2260" />
    <meta name="build-revision" content="white-screen-fix-17894bc9-refresh" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NFOOD | نظام تشغيل المطاعم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div class="gtranslate_wrapper"></div>
    <script>
      window.gtranslateSettings = {
        "default_language": "ar",
        "native_language_names": true,
        "detect_browser_language": true,
        "languages": ["ar", "fr", "en"],
        "wrapper_selector": ".gtranslate_wrapper",
        "flag_size": 16,
        "switcher_vertical_position": "top",
        "switcher_open_direction": "top",
        "flag_style": "3d",
        "alt_flags": { "en": "usa" },
        "switcher_text_color": "#f7f7f7",
        "switcher_arrow_color": "#f2f2f2",
        "switcher_border_color": "#161616",
        "switcher_background_color": "#303030",
        "switcher_background_shadow_color": "#474747",
        "switcher_background_hover_color": "#3a3a3a",
        "dropdown_text_color": "#eaeaea",
        "dropdown_hover_color": "#748393",
        "dropdown_background_color": "#474747"
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
