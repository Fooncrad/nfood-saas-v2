name: NFOOD Verify

on:
  push:
    branches: [main, build/production-dist, build/production-dist177]
  pull_request:
    branches: [main, build/production-dist, build/production-dist177]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run server/sensitive-permissions.test.ts server/rbac.test.ts server/phase1-branch-controls.test.ts client/src/dashboard-theme-shortcuts.test.ts
      - name: Verify POS, orders, reservations, invoices and PWA
        run: pnpm exec vitest run server/orderPricing.test.ts server/payment-workflow.test.ts server/receiptDelivery.test.ts server/reservations.test.ts server/reservationNotifications.test.ts server/financial-ledger.test.ts client/src/lib/posPaymentModel.test.ts client/src/lib/posPricing.test.ts client/src/lib/waiterCallReservation.test.ts client/src/lib/customerOnlyMarketplace.test.ts client/src/pages/ReservationsView.test.ts client/src/pwa.test.ts
      - name: Verify translation coverage
        run: pnpm exec vitest run client/src/contexts/LanguageContext.test.ts client/src/lib/translationCoverage.test.ts client/src/lib/translationManagement.test.ts client/src/components/TranslationReviewPanel.test.ts server/menuTranslation.test.ts server/translation.approval.test.ts server/emailTemplates.test.ts
      - run: pnpm i18n:check
      - run: pnpm build
