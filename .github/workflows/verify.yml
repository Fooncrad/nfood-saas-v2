name: NFOOD Verify

on:
  push:
    branches: [main, build/production-dist, build/production-dist177]
  pull_request:
    branches: [main, build/production-dist, build/production-dist177]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run server/sensitive-permissions.test.ts server/rbac.test.ts server/phase1-branch-controls.test.ts client/src/dashboard-theme-shortcuts.test.ts
      - run: pnpm i18n:check
      - run: pnpm build
