name: NFOOD Verify

on:
  push:
    branches: [main, build/production-dist]
  pull_request:
    branches: [main, build/production-dist]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm i18n:check
      - run: pnpm build
